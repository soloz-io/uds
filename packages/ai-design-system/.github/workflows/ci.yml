name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate-and-test:
    name: Validate & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run all validations
        run: node scripts/run-all-validations.js
      
      - name: Generate type definitions
        run: node scripts/generate-dts.js
      
      - name: Verify types are up to date
        run: |
          if [ -n "$(git status --porcelain dist/index.d.ts)" ]; then
            echo "❌ Type definitions are out of date. Run 'node scripts/generate-dts.js' and commit the changes."
            git diff dist/index.d.ts
            exit 1
          fi
      
      - name: Build library
        run: pnpm build:lib
      
      - name: Run linter
        run: pnpm lint
      
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      
      - name: Run tests
        run: pnpm test || echo "No tests configured yet"

  publish:
    name: Publish to npm
    needs: validate-and-test
    runs-on: ubuntu-latest
    # Only run on push to main/master (not on PRs)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build library
        run: pnpm build:lib
      
      - name: Check if version changed
        id: version-check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          LATEST_VERSION=$(npm view ai-design-system version 2>/dev/null || echo "0.0.0")
          echo "Current version: $CURRENT_VERSION"
          echo "Latest published: $LATEST_VERSION"
          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "✅ New version detected, will publish"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Version already published, skipping"
          fi
      
      - name: Publish to npm
        if: steps.version-check.outputs.should_publish == 'true'
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

